# Netlify configuration — static site, no build step required
# Docs: https://docs.netlify.com/configure-builds/file-based-configuration/

[build]
  publish = "."
  command = "echo Static site — no build required"

# SPA fallback not needed; this is a multi-page static app (index.html, privacy.html, terms.html)

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/styles/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
